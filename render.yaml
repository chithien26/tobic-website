# Render Blueprint for the API. Render dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are asked for when the blueprint is created.
services:
  - type: web
    name: tobic-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false # Neon connection string (postgresql://...)
      - key: Jwt__Key
        generateValue: true
      - key: Web__BaseUrl
        sync: false # website URL, e.g. https://tobic-web.vercel.app
      - key: Web__RevalidateSecret
        sync: false # same value as REVALIDATE_SECRET on the website
      - key: Cors__Origins__0
        sync: false # website URL again
      - key: Seed__AdminEmail
        value: admin@tobic.com.vn
      - key: Seed__AdminPassword
        sync: false
      - key: Storage__UploadRoot
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
